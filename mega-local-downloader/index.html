<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MEGA 本地下载器</title>
  <style>
    :root{color-scheme:dark;font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:#080d18;color:#eef2ff;font-synthesis:none;text-rendering:optimizeLegibility}*{box-sizing:border-box}body{min-height:100vh;margin:0;padding:clamp(24px,7vh,72px) 16px;background:radial-gradient(ellipse at 50% -10%,#17314a 0,transparent 48%),radial-gradient(ellipse at 100% 80%,#10263a 0,transparent 38%),#080d18}body:before{position:fixed;inset:-30%;z-index:0;pointer-events:none;background:radial-gradient(circle at 25% 35%,#0e9fbd18,transparent 26%),radial-gradient(circle at 75% 60%,#7265ff13,transparent 28%);content:"";animation:ambient 24s ease-in-out infinite alternate}.card{position:relative;z-index:1;max-width:820px;margin:auto;padding:clamp(22px,5vw,40px);overflow:hidden;background:linear-gradient(145deg,#171f30f5,#111827f5);border:1px solid #334259;border-radius:24px;box-shadow:0 28px 90px #0008, inset 0 1px #ffffff08;animation:rise-in .65s cubic-bezier(.2,.75,.25,1) both}.hero{margin-bottom:26px}.eyebrow{display:inline-flex;align-items:center;gap:8px;margin-bottom:12px;color:#81dbea;font-size:11px;font-weight:750;letter-spacing:.16em}.live-dot{width:7px;height:7px;border-radius:50%;background:#36d6c2;box-shadow:0 0 12px #36d6c2a8}h1{margin:0;font-size:clamp(27px,5vw,36px);line-height:1.2;letter-spacing:-.04em}h1 span{color:#bdeef4}p,.hint{color:#aab6cc}.hero p{margin:12px 0 0}.row{display:flex;gap:10px;margin:24px 0 16px}input,button,select{font:inherit;border-radius:12px;padding:13px 15px}input{min-width:0;flex:1;background:#0b1220;border:1px solid #3b4b64;color:#fff;transition:border-color .18s,box-shadow .18s}input:focus{border-color:#16bfd2;outline:0;box-shadow:0 0 0 4px #0e9fbd24}button{border:0;background:linear-gradient(135deg,#11abc1,#0985ad);color:white;font-weight:700;cursor:pointer;box-shadow:0 5px 16px #078bab26;transition:transform .16s,filter .16s,box-shadow .16s}button:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-2px);box-shadow:0 9px 22px #078bab3b}button:active:not(:disabled){transform:translateY(0) scale(.98)}button.pause,.delete{background:#34445a;box-shadow:none}button.pause:hover:not(:disabled),.delete:hover:not(:disabled){background:#455a74}button:disabled{opacity:.55;cursor:wait;box-shadow:none}select{background:#0d1423;border:1px solid #3a4863;color:#eef2ff;cursor:pointer}button:focus-visible,select:focus-visible{outline:3px solid #19bdd4;outline-offset:2px}.file{border-top:1px solid #2a3449;padding:18px 0;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;animation:rise-in .35s ease both}.name{overflow-wrap:anywhere}.meta,.status{font-size:13px;color:#aab6cc}.meta{grid-column:1}.actions{grid-column:2;grid-row:1/3;display:flex;align-items:center;gap:8px}.status{grid-column:1/-1;min-height:1.4em}progress{width:100%;height:9px;grid-column:1/-1;overflow:hidden;border:0;border-radius:99px;background:#283448;accent-color:#13bad0}progress::-webkit-progress-bar{border-radius:99px;background:#283448}progress::-webkit-progress-value{border-radius:99px;background:linear-gradient(90deg,#0e9fbd,#63e3d1);transition:width .35s ease}progress::-moz-progress-bar{border-radius:99px;background:linear-gradient(90deg,#0e9fbd,#63e3d1)}#message{min-height:24px;color:#8fe4f2}.partials{margin-top:28px;padding:20px;background:#0b122080;border:1px solid #29374d;border-radius:16px}.partials h2{margin:0 0 5px;font-size:18px}.partials>p{margin:0 0 12px;font-size:13px}.partial{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px solid #263247;padding:13px 0;animation:fade-in .25s ease both}.partial-info{min-width:0}.partial-info .name{display:block}.partial .meta{margin-top:4px}.delete{flex:none}.card>.hint{margin:22px 0 0;font-size:13px}@keyframes rise-in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}@keyframes fade-in{from{opacity:0}to{opacity:1}}@keyframes ambient{from{transform:translate3d(-1%,0,0) scale(1)}to{transform:translate3d(1%,1%,0) scale(1.06)}}@media(max-width:560px){body{padding:20px 12px}.card{padding:22px 18px;border-radius:19px}.row{flex-direction:column}.file{grid-template-columns:1fr}.actions{grid-column:1;grid-row:auto;justify-content:flex-start;flex-wrap:wrap}.meta{grid-column:1}.partials{padding:16px}.partial{align-items:flex-start;flex-direction:column}.partial .delete{padding:9px 12px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
    #file-tools{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:center;margin:18px 0 4px}#file-tools[hidden]{display:none}#file-tools label{font-size:13px;font-weight:700;color:#b8c5d8}#file-tools input{grid-column:1/-1;width:100%}#file-count{grid-column:2;grid-row:1;color:#8fe4f2;font-size:12px;text-align:right}#empty-search{padding:22px 0;color:#aab6cc;text-align:center}#empty-search[hidden]{display:none}.file[hidden]{display:none}
    .file-list{margin-top:10px;border-top:1px solid #2a3449}.file-list>summary{display:flex;align-items:center;gap:10px;padding:14px 2px;color:#8fe4f2;font-weight:700;cursor:pointer;list-style:none}.file-list>summary::-webkit-details-marker{display:none}.file-list>summary:before{content:"›";display:inline-grid;width:22px;height:22px;place-items:center;border:1px solid #3a4863;border-radius:7px;color:#c4d2e5;font-size:20px;line-height:1;transition:transform .18s}.file-list[open]>summary:before{transform:rotate(90deg)}.file-list>summary:hover{color:#c7f6fb}
  </style>
</head>
<body>
  <main class="card">
    <header class="hero">
      <div class="eyebrow"><span class="live-dot"></span> LOCAL TRANSFER</div>
      <h1>MEGA <span>本地下载器</span></h1>
      <p>下载数据由你的电脑直接连接 MEGA 并保存到本机，不经 Cloudflare Worker。</p>
    </header>
    <form id="form" class="row">
      <input id="link" type="url" placeholder="粘贴 MEGA 文件或文件夹链接" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" required>
      <button id="load">读取链接</button>
    </form>
    <div id="message" role="status"></div>
    <div id="file-tools" hidden>
      <label for="file-search">搜索文件名</label>
      <span id="file-count" aria-live="polite"></span>
      <input id="file-search" type="search" placeholder="输入文件名筛选…" autocomplete="off" spellcheck="false">
    </div>
    <details id="file-list" class="file-list" hidden>
      <summary id="file-list-summary">文件列表</summary>
      <section id="files"></section>
      <div id="empty-search" hidden>没有找到匹配的文件，试试其他关键词。</div>
    </details>
    <section class="partials" aria-labelledby="partials-title">
      <h2 id="partials-title">未完成下载</h2>
      <p class="hint">中断或取消后，已下载部分会保存在 downloads 文件夹并继续占用空间。删除记录会同时删除临时文件，释放空间，但不能再续传。</p>
      <div id="partials-list" class="hint" role="status">正在检查临时文件…</div>
    </section>
    <p class="hint">连接数越高可能越快，也可能更容易触发 MEGA 限流；不稳定时请调回 2。暂停后点“继续”恢复；断线后点“下载 / 续传”。</p>
  </main>
  <script>
    const $ = selector => document.querySelector(selector);
    const filesBox = $('#files');
    const fileTools = $('#file-tools');
    const fileSearch = $('#file-search');
    const fileCount = $('#file-count');
    const emptySearch = $('#empty-search');
    const fileList = $('#file-list');
    const fileListSummary = $('#file-list-summary');
    const partialsList = $('#partials-list');
    const message = $('#message');
    let indexId = '';
    let totalFiles = 0;

    const size = bytes => bytes < 1024 ** 3
      ? `${(bytes / 1024 ** 2).toFixed(1)} MB`
      : `${(bytes / 1024 ** 3).toFixed(2)} GB`;

    $('#form').addEventListener('submit', async event => {
      event.preventDefault();
      $('#load').disabled = true;
      message.textContent = '正在读取 MEGA 文件信息…';
      filesBox.replaceChildren();
      fileTools.hidden = true;
      fileList.hidden = true;
      fileList.open = false;
      emptySearch.hidden = true;
      fileSearch.value = '';
      try {
        const response = await fetch('/api/index', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ link: $('#link').value.trim() })
        });
        const result = await response.json();
        if (!response.ok) throw Error(result.error);
        indexId = result.indexId;
        totalFiles = result.files.length;
        message.textContent = `找到 ${result.files.length} 个文件`;
        fileTools.hidden = totalFiles < 2;
        fileList.hidden = totalFiles === 0;
        fileList.open = totalFiles <= 20;
        for (const file of result.files) addFile(file);
        updateFileFilter();
      } catch (error) {
        message.textContent = error.message;
      } finally {
        $('#load').disabled = false;
      }
    });

    fileSearch.addEventListener('input', updateFileFilter);
    fileList.addEventListener('toggle', () => {
      fileListSummary.textContent = fileList.open ? `收起文件列表（${totalFiles}）` : `展开文件列表（${totalFiles}）`;
    });

    function updateFileFilter() {
      const query = fileSearch.value.trim().toLocaleLowerCase();
      if (query) fileList.open = true;
      let visible = 0;
      for (const row of filesBox.querySelectorAll('.file')) {
        const matches = row.dataset.searchName.includes(query);
        row.hidden = !matches;
        if (matches) visible++;
      }
      fileCount.textContent = `显示 ${visible} / ${totalFiles} 个`;
      fileListSummary.textContent = fileList.open ? `收起文件列表（${totalFiles}）` : `展开文件列表（${totalFiles}）`;
      emptySearch.hidden = visible > 0 || totalFiles === 0;
    }

    function addFile(file) {
      const row = document.createElement('article');
      row.className = 'file';
      row.dataset.searchName = file.name.toLocaleLowerCase();
      const name = document.createElement('div');
      name.className = 'name';
      name.textContent = file.name;
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = size(file.size);
      const actions = document.createElement('div');
      actions.className = 'actions';
      const connections = document.createElement('select');
      connections.setAttribute('aria-label', '并发连接数');
      for (const count of [2, 4, 8]) {
        const option = document.createElement('option');
        option.value = count;
        option.textContent = `${count} 连接`;
        connections.append(option);
      }
      const downloadButton = document.createElement('button');
      downloadButton.textContent = '下载 / 续传';
      const pauseButton = document.createElement('button');
      pauseButton.className = 'pause';
      pauseButton.textContent = '暂停';
      pauseButton.disabled = true;
      const status = document.createElement('div');
      status.className = 'status';
      const task = { jobId: '' };

      actions.append(connections, downloadButton, pauseButton);
      row.append(name, meta, actions, status);
      filesBox.append(row);
      downloadButton.addEventListener('click', () => download(file, connections, downloadButton, pauseButton, status, row, task));
      pauseButton.addEventListener('click', () => pause(task, pauseButton, status));
    }

    async function download(file, connections, downloadButton, pauseButton, status, row, task) {
      downloadButton.disabled = true;
      connections.disabled = true;
      status.textContent = '正在开始…';
      let progress = row.querySelector('progress');
      if (!progress) {
        progress = document.createElement('progress');
        progress.max = file.size;
        row.append(progress);
      }

      try {
        const response = await fetch('/api/download', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ indexId, fileId: file.id, connections: Number(connections.value) })
        });
        const result = await response.json();
        if (!response.ok) throw Error(result.error);
        task.jobId = result.jobId;
        pauseButton.dataset.action = 'pause';
        pauseButton.textContent = '暂停';
        pauseButton.disabled = false;

        while (task.jobId) {
          await new Promise(resolve => setTimeout(resolve, 1000));
          const job = await (await fetch(`/api/jobs/${task.jobId}`)).json();
          progress.value = job.received || 0;
          if (job.state === 'complete') status.textContent = `完成，已保存到 downloads：${job.path.split(/[\\/]/).pop()}`;
          else if (job.state === 'paused') {
            status.textContent = `已暂停（${size(job.received || 0)} / ${size(file.size)}）`;
            pauseButton.dataset.action = 'resume';
            pauseButton.textContent = '继续';
            pauseButton.disabled = false;
          }
          else if (job.state === 'interrupted') status.textContent = `已中断，可续传：${job.error}`;
          else {
            status.textContent = `${size(job.received || 0)} / ${size(file.size)}`;
            pauseButton.dataset.action = 'pause';
            pauseButton.textContent = '暂停';
            pauseButton.disabled = false;
          }

          if (['complete', 'interrupted'].includes(job.state)) {
            task.jobId = '';
            pauseButton.disabled = true;
            refreshPartials();
          }
        }
      } catch (error) {
        status.textContent = error.message;
      } finally {
        downloadButton.disabled = false;
        connections.disabled = false;
        pauseButton.disabled = !task.jobId;
      }
    }

    async function pause(task, pauseButton, status) {
      if (!task.jobId) return;
      const action = pauseButton.dataset.action;
      pauseButton.disabled = true;
      status.textContent = action === 'pause' ? '正在暂停…' : '正在继续…';
      try {
        const response = await fetch('/api/pause', {
          method: 'POST',
          headers: { 'content-type': 'application/json' },
          body: JSON.stringify({ jobId: task.jobId, action })
        });
        const result = await response.json();
        if (!response.ok) throw Error(result.error);
        pauseButton.dataset.action = result.state === 'paused' ? 'resume' : 'pause';
        pauseButton.textContent = result.state === 'paused' ? '继续' : '暂停';
        pauseButton.disabled = false;
      } catch (error) {
        status.textContent = error.message;
        pauseButton.disabled = false;
      }
    }

    async function refreshPartials() {
      try {
        const response = await fetch('/api/partials');
        const { partials } = await response.json();
        partialsList.replaceChildren();
        if (!partials.length) {
          partialsList.textContent = '没有保留的未完成文件。';
          return;
        }
        for (const partial of partials) {
          const row = document.createElement('div');
          row.className = 'partial';
          const info = document.createElement('div');
          info.className = 'partial-info';
          const name = document.createElement('span');
          name.className = 'name';
          name.textContent = partial.name;
          const meta = document.createElement('div');
          meta.className = 'meta';
          const total = partial.total ? ` / ${size(partial.total)}` : '';
          meta.textContent = `${size(partial.size)}${total} · ${new Date(partial.updatedAt).toLocaleString()}`;
          const remove = document.createElement('button');
          remove.className = 'delete';
          remove.textContent = '删除并释放空间';
          remove.addEventListener('click', async () => {
            if (!confirm(`删除“${partial.name}”的未完成数据？删除后无法续传。`)) return;
            remove.disabled = true;
            try {
              const deleted = await fetch('/api/delete-partial', {
                method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ id: partial.id })
              });
              const result = await deleted.json();
              if (!deleted.ok) throw Error(result.error);
              refreshPartials();
            } catch (error) {
              alert(error.message);
              remove.disabled = false;
            }
          });
          info.append(name, meta);
          row.append(info, remove);
          partialsList.append(row);
        }
      } catch {
        partialsList.textContent = '读取临时文件记录失败；请刷新页面重试。';
      }
    }

    refreshPartials();
  </script>
</body>
</html>
